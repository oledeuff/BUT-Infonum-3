<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc"><title id="title">Modèle de Lasswell</title><desc id="desc">Schéma du modèle de Lasswell en français.</desc><defs><style>.bg{fill:#f6f7fb}.title{font:700 30px 'Inter',Arial,sans-serif;fill:#213547}.subtitle{font:400 16px 'Inter',Arial,sans-serif;fill:#425466}.label{font:700 18px 'Inter',Arial,sans-serif;fill:#213547}.small{font:400 15px 'Inter',Arial,sans-serif;fill:#425466}.box{fill:#fff;stroke:#1db6c3;stroke-width:3;rx:18;ry:18}.arrow{stroke:#1db6c3;stroke-width:4;fill:none;marker-end:url(#m)}.caption{font:400 14px 'Inter',Arial,sans-serif;fill:#5b6875}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1db6c3"/></marker></defs><rect class="bg" width="1400" height="500"/><text x="60" y="56" class="title">Modèle de Lasswell</text><text x="60" y="84" class="subtitle">« Qui dit quoi, par quel canal, à qui, avec quels effets ? »</text><rect x="80" y="180" width="210" height="110" class="box"/><text x="185" y="220" text-anchor="middle" class="label">Qui ?</text><text x="185" y="248" text-anchor="middle" class="small">L'émetteur</text><text x="185" y="270" text-anchor="middle" class="small">ou l'instance d'énonciation</text><rect x="340" y="180" width="210" height="110" class="box"/><text x="445" y="220" text-anchor="middle" class="label">Dit quoi ?</text><text x="445" y="248" text-anchor="middle" class="small">Le contenu</text><text x="445" y="270" text-anchor="middle" class="small">ou le message</text><rect x="600" y="180" width="210" height="110" class="box"/><text x="705" y="220" text-anchor="middle" class="label">Par quel canal ?</text><text x="705" y="248" text-anchor="middle" class="small">Le média, le support,</text><text x="705" y="270" text-anchor="middle" class="small">le dispositif</text><rect x="860" y="180" width="210" height="110" class="box"/><text x="965" y="220" text-anchor="middle" class="label">À qui ?</text><text x="965" y="248" text-anchor="middle" class="small">Le récepteur,</text><text x="965" y="270" text-anchor="middle" class="small">le public</text><rect x="1120" y="180" width="210" height="110" class="box"/><text x="1225" y="220" text-anchor="middle" class="label">Avec quels effets ?</text><text x="1225" y="248" text-anchor="middle" class="small">Effets, influence,</text><text x="1225" y="270" text-anchor="middle" class="small">réception</text><path d="M290 235 H340" class="arrow"/><path d="M550 235 H600" class="arrow"/><path d="M810 235 H860" class="arrow"/><path d="M1070 235 H1120" class="arrow"/><rect x="80" y="338" width="1250" height="64" fill="#fff" stroke="#d8dee9" rx="14"/><text x="100" y="365" class="caption">Lecture du modèle : l'analyse porte sur les acteurs, les messages, les canaux, les publics et les effets.</text><text x="100" y="388" class="caption">Intérêt pédagogique : il ouvre sur l'analyse des médias de masse et sur les approches centrées sur les effets et les contenus.</text><text x="60" y="466" class="caption">Schéma redessiné pour le site BUT Infonum 1A à partir de la formule classique de Harold D. Lasswell.</text></svg>