<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">Modèle de Shannon et Weaver</title><desc id="desc">Schéma du modèle de Shannon et Weaver en français.</desc><defs><style>.bg{fill:#f6f7fb}.title{font:700 30px 'Inter',Arial,sans-serif;fill:#213547}.label{font:600 18px 'Inter',Arial,sans-serif;fill:#213547}.small{font:400 15px 'Inter',Arial,sans-serif;fill:#425466}.box{fill:#fff;stroke:#1db6c3;stroke-width:3;rx:18;ry:18}.aux{fill:#eef8fa;stroke:#7b8794;stroke-width:2;stroke-dasharray:8 8;rx:18;ry:18}.arrow{stroke:#1db6c3;stroke-width:4;fill:none;marker-end:url(#m)}.noise{stroke:#7b8794;stroke-width:3;fill:none;marker-end:url(#m2)}.caption{font:400 14px 'Inter',Arial,sans-serif;fill:#5b6875}.chip{fill:#dff7f9;stroke:#1db6c3;stroke-width:1.5;rx:12;ry:12}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1db6c3"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b8794"/></marker></defs><rect class="bg" width="1400" height="520"/><text x="60" y="58" class="title">Modèle de Shannon et Weaver</text><text x="60" y="86" class="caption">La communication est pensée comme une transmission d'information à travers un canal, avec possibilité de bruit.</text><rect x="70" y="190" width="150" height="88" class="box"/><text x="145" y="228" text-anchor="middle" class="label">Source</text><text x="145" y="252" text-anchor="middle" class="small">ou émetteur</text><rect x="280" y="190" width="180" height="88" class="box"/><text x="370" y="228" text-anchor="middle" class="label">Encodeur</text><text x="370" y="252" text-anchor="middle" class="small">transmetteur</text><rect x="520" y="174" width="270" height="120" class="box"/><text x="655" y="214" text-anchor="middle" class="label">Canal</text><text x="655" y="240" text-anchor="middle" class="small">signal transmis</text><rect x="592" y="252" width="126" height="28" class="chip"/><text x="655" y="271" text-anchor="middle" class="caption">message / signal</text><rect x="850" y="190" width="180" height="88" class="box"/><text x="940" y="228" text-anchor="middle" class="label">Décodeur</text><text x="940" y="252" text-anchor="middle" class="small">récepteur</text><rect x="1090" y="190" width="180" height="88" class="box"/><text x="1180" y="228" text-anchor="middle" class="label">Destination</text><text x="1180" y="252" text-anchor="middle" class="small">ou destinataire</text><path d="M220 234 H280" class="arrow"/><path d="M460 234 H520" class="arrow"/><path d="M790 234 H850" class="arrow"/><path d="M1030 234 H1090" class="arrow"/><rect x="580" y="352" width="150" height="72" class="aux"/><text x="655" y="390" text-anchor="middle" class="label">Bruit</text><text x="655" y="412" text-anchor="middle" class="small">parasites / perturbations</text><path d="M655 352 V296" class="noise"/><rect x="72" y="120" width="1196" height="44" fill="#fff" stroke="#d8dee9" rx="12"/><text x="92" y="147" class="caption">Intérêt du modèle : penser le signal, l'efficacité de la transmission, la quantité d'information et les perturbations du canal.</text><text x="60" y="486" class="caption">Schéma redessiné pour le site BUT Infonum 1A à partir du modèle classique de Shannon et Weaver.</text></svg>