<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">Approche interactionnelle et Palo Alto</title><desc id="desc">Schéma circulaire inspiré de l'école de Palo Alto.</desc><defs><style>.bg{fill:#f6f7fb}.title{font:700 30px 'Inter',Arial,sans-serif;fill:#213547}.subtitle{font:400 16px 'Inter',Arial,sans-serif;fill:#425466}.label{font:700 18px 'Inter',Arial,sans-serif;fill:#213547}.small{font:400 15px 'Inter',Arial,sans-serif;fill:#425466}.caption{font:400 14px 'Inter',Arial,sans-serif;fill:#5b6875}.box{fill:#fff;stroke:#1db6c3;stroke-width:3;rx:20;ry:20}.soft{fill:#eef8fa;stroke:#9dc7ce;stroke-width:2;rx:16;ry:16}.loop{stroke:#1db6c3;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1db6c3"/></marker></defs><rect class="bg" width="1400" height="620"/><text x="60" y="56" class="title">Approche interactionnelle · Palo Alto</text><text x="60" y="84" class="subtitle">La communication n'est pas une simple ligne de transmission : elle relève d'une interaction située, relationnelle et circulaire.</text><rect x="210" y="230" width="250" height="120" class="box"/><text x="335" y="275" text-anchor="middle" class="label">Acteur A</text><text x="335" y="302" text-anchor="middle" class="small">paroles, gestes, silences,</text><text x="335" y="324" text-anchor="middle" class="small">postures</text><rect x="940" y="230" width="250" height="120" class="box"/><text x="1065" y="275" text-anchor="middle" class="label">Acteur B</text><text x="1065" y="302" text-anchor="middle" class="small">interprétations, réponses,</text><text x="1065" y="324" text-anchor="middle" class="small">ajustements</text><path d="M460 290 C620 170 780 170 940 290" class="loop"/><path d="M940 310 C780 430 620 430 460 310" class="loop"/><rect x="535" y="220" width="330" height="140" class="soft"/><text x="700" y="254" text-anchor="middle" class="label">Relation / interaction</text><text x="700" y="282" text-anchor="middle" class="small">Rétroaction (feedback)</text><text x="700" y="306" text-anchor="middle" class="small">Ponctuation des échanges</text><text x="700" y="330" text-anchor="middle" class="small">Niveau de contenu et niveau de relation</text><rect x="210" y="456" width="980" height="88" fill="#fff" stroke="#d8dee9" rx="14"/><text x="240" y="486" class="caption">Axiomes souvent associés à Palo Alto : on ne peut pas ne pas communiquer ; toute communication présente un aspect de contenu et un aspect relationnel ;</text><text x="240" y="510" class="caption">les échanges sont circulaires et dépendent du contexte, de l'interprétation et de la relation entre les acteurs.</text><text x="60" y="590" class="caption">Schéma redessiné pour le site BUT Infonum 1A à partir des approches de Bateson et Watzlawick.</text></svg>