<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">Modèle de Jakobson</title><desc id="desc">Schéma du modèle de Roman Jakobson en français.</desc><defs><style>.bg{fill:#f6f7fb}.title{font:700 30px 'Inter',Arial,sans-serif;fill:#213547}.subtitle{font:400 16px 'Inter',Arial,sans-serif;fill:#425466}.label{font:700 18px 'Inter',Arial,sans-serif;fill:#213547}.small{font:400 15px 'Inter',Arial,sans-serif;fill:#425466}.tiny{font:400 14px 'Inter',Arial,sans-serif;fill:#5b6875}.box{fill:#fff;stroke:#1db6c3;stroke-width:3;rx:18;ry:18}.soft{fill:#eef8fa;stroke:#9dc7ce;stroke-width:2;rx:16;ry:16}.arrow{stroke:#1db6c3;stroke-width:3;fill:none;marker-end:url(#m)}.line{stroke:#7b8794;stroke-width:2;fill:none}.caption{font:400 14px 'Inter',Arial,sans-serif;fill:#5b6875}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1db6c3"/></marker></defs><rect class="bg" width="1400" height="620"/><text x="60" y="56" class="title">Modèle de Jakobson</text><text x="60" y="84" class="subtitle">Le message fonctionne dans une situation de communication structurée par six facteurs.</text><rect x="135" y="250" width="220" height="96" class="box"/><text x="245" y="289" text-anchor="middle" class="label">Destinateur</text><text x="245" y="314" text-anchor="middle" class="small">instance qui émet</text><rect x="520" y="248" width="360" height="100" class="box"/><text x="700" y="287" text-anchor="middle" class="label">Message</text><text x="700" y="314" text-anchor="middle" class="small">ce qui est formulé et transmis</text><rect x="1045" y="250" width="220" height="96" class="box"/><text x="1155" y="289" text-anchor="middle" class="label">Destinataire</text><text x="1155" y="314" text-anchor="middle" class="small">instance qui reçoit</text><path d="M355 298 H520" class="arrow"/><path d="M880 298 H1045" class="arrow"/><rect x="540" y="130" width="320" height="70" class="soft"/><text x="700" y="160" text-anchor="middle" class="label">Contexte</text><text x="700" y="182" text-anchor="middle" class="tiny">référent, situation, monde évoqué</text><path d="M700 200 V248" class="line"/><rect x="540" y="392" width="320" height="70" class="soft"/><text x="700" y="422" text-anchor="middle" class="label">Code</text><text x="700" y="444" text-anchor="middle" class="tiny">langue, système de signes partagé</text><path d="M700 348 V392" class="line"/><rect x="420" y="500" width="560" height="64" class="soft"/><text x="700" y="528" text-anchor="middle" class="label">Contact</text><text x="700" y="550" text-anchor="middle" class="tiny">canal physique et psychologique qui maintient la communication</text><path d="M245 346 C280 450 420 500 520 500" class="line"/><path d="M1155 346 C1120 450 980 500 880 500" class="line"/><rect x="70" y="116" width="410" height="88" fill="#fff" stroke="#d8dee9" rx="14"/><text x="92" y="145" class="caption">Le modèle de Jakobson enrichit les approches linéaires : il ne s'agit plus seulement de transmettre un signal.</text><text x="92" y="168" class="caption">Il insiste sur les fonctions du langage et sur la pluralité des facteurs en jeu dans la communication.</text><text x="60" y="594" class="caption">Schéma redessiné pour le site BUT Infonum 1A à partir du modèle de Roman Jakobson.</text></svg>