<script>
  document.addEventListener("DOMContentLoaded", function () {
    // 1. CSV Google Sheets
    var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSDqLNh7LX8_aAqQbDy0cfusAT82CQn1Cb50u_iMjy8NWg3SdaiNcMVMI1LMi-rGiz1UipK3F-ES_BJ/pub?gid=0&single=true&output=csv";

    // 2. Données par défaut (écrasées si le CSV est chargé avec succès).
    //    On utilise EXACTEMENT les mêmes champs que dans le tableur :
    //    id, type, titre, resume, tags (tableau), url, etudiant, figure.
    var nodesData = {
      p1:  { id: "p1",  type: "Projet étudiant", titre: "Projet 1",  resume: "", tags: [], url: "", etudiant: "Étudiant·e 1",  figure: "Figure 1" },
      p2:  { id: "p2",  type: "Projet étudiant", titre: "Projet 2",  resume: "", tags: [], url: "", etudiant: "Étudiant·e 2",  figure: "Figure 2" },
      p3:  { id: "p3",  type: "Projet étudiant", titre: "Projet 3",  resume: "", tags: [], url: "", etudiant: "Étudiant·e 3",  figure: "Figure 3" },
      p4:  { id: "p4",  type: "Projet étudiant", titre: "Projet 4",  resume: "", tags: [], url: "", etudiant: "Étudiant·e 4",  figure: "Figure 4" },
      p5:  { id: "p5",  type: "Projet étudiant", titre: "Projet 5",  resume: "", tags: [], url: "", etudiant: "Étudiant·e 5",  figure: "Figure 5" },
      p6:  { id: "p6",  type: "Projet étudiant", titre: "Projet 6",  resume: "", tags: [], url: "", etudiant: "Étudiant·e 6",  figure: "Figure 6" },
      p7:  { id: "p7",  type: "Projet étudiant", titre: "Projet 7",  resume: "", tags: [], url: "", etudiant: "Étudiant·e 7",  figure: "Figure 7" },
      p8:  { id: "p8",  type: "Projet étudiant", titre: "Projet 8",  resume: "", tags: [], url: "", etudiant: "Étudiant·e 8",  figure: "Figure 8" },
      p9:  { id: "p9",  type: "Projet étudiant", titre: "Projet 9",  resume: "", tags: [], url: "", etudiant: "Étudiant·e 9",  figure: "Figure 9" },
      p10: { id: "p10", type: "Projet étudiant", titre: "Projet 10", resume: "", tags: [], url: "", etudiant: "Étudiant·e 10", figure: "Figure 10" },
      p11: { id: "p11", type: "Projet étudiant", titre: "Projet 11", resume: "", tags: [], url: "", etudiant: "Étudiant·e 11", figure: "Figure 11" },
      p12: { id: "p12", type: "Projet étudiant", titre: "Projet 12", resume: "", tags: [], url: "", etudiant: "Étudiant·e 12", figure: "Figure 12" },
      p13: { id: "p13", type: "Projet étudiant", titre: "Projet 13", resume: "", tags: [], url: "", etudiant: "Étudiant·e 13", figure: "Figure 13" },
      p14: { id: "p14", type: "Projet étudiant", titre: "Projet 14", resume: "", tags: [], url: "", etudiant: "Étudiant·e 14", figure: "Figure 14" },
      p15: { id: "p15", type: "Projet étudiant", titre: "Projet 15", resume: "", tags: [], url: "", etudiant: "Étudiant·e 15", figure: "Figure 15" },

      // m1 = site du BUT ; m2 = description de cours
      m1:  { id: "m1", type: "Méta", titre: "Site du BUT Info-num",
             resume: "Lien vers la page officielle du BUT.", tags: ["BUT", "formation"],
             url: "", etudiant: "", figure: "BUT Information numérique" },
      m2:  { id: "m2", type: "Méta", titre: "Description du cours et consignes",
             resume: "Objectifs pédagogiques, déroulé de l’UE et consignes pour le projet.",
             tags: ["cours", "consignes"], url: "",
             etudiant: "", figure: "Cours d’architecture de l’information" }
    };

    var appEl = document.getElementById("app");
    var infoTitleEl = document.getElementById("info-title");
    var infoMetaEl = document.getElementById("info-meta");
    var infoDescEl = document.getElementById("info-description");
    var infoTagsEl = document.getElementById("info-tags");
    var infoLinkEl = document.getElementById("info-link");
    var btnPreviewEl = document.getElementById("btnPreview");
    var listViewEl = document.getElementById("list-view");
    var btnListEl = document.getElementById("btnList");
    var tesseractZoneEl = document.querySelector(".tesseract-zone");
    var tesseractEl = document.querySelector(".tesseract");

    /* Parseur CSV simple ("," ou ";") */
    function parseCSV(text) {
      var rows = [];
      var current = "";
      var row = [];
      var inQuotes = false;

      for (var i = 0; i < text.length; i++) {
        var c = text[i];

        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            current += c;
          }
        } else {
          if (c === '"') {
            inQuotes = true;
          } else if (c === "," || c === ";") {
            row.push(current);
            current = "";
          } else if (c === "\r") {
            // ignore
          } else if (c === "\n") {
            row.push(current);
            if (row.some(function (cell) { return cell.trim() !== ""; })) {
              rows.push(row);
            }
            row = [];
            current = "";
          } else {
            current += c;
          }
        }
      }
      if (current.length || row.length) {
        row.push(current);
        if (row.some(function (cell) { return cell.trim() !== ""; })) {
          rows.push(row);
        }
      }

      if (!rows.length) return [];

      var header = rows[0].map(function (h) { return h.trim(); });
      var dataRows = rows.slice(1);

      return dataRows.map(function (r) {
        var obj = {};
        for (var j = 0; j < header.length; j++) {
          obj[header[j]] = (r[j] || "").trim();
        }
        return obj;
      });
    }

    // Harmonisation des nœuds (projet / méta + aria-label)
    function syncNodesWithData() {
      var nodeEls = document.querySelectorAll(".node");
      nodeEls.forEach(function (node) {
        var id = node.getAttribute("data-id");
        var data = nodesData[id];
        if (!data) return;

        node.classList.remove("projet", "meta");
        var typeLower = (data.type || "").toLowerCase();
        if (typeLower.indexOf("méta") !== -1 || typeLower.indexOf("meta") !== -1) {
          node.classList.add("meta");
        } else {
          node.classList.add("projet");
        }

        var labelParts = [];
        if (data.titre) labelParts.push(data.titre);
        if (data.etudiant) labelParts.push("– " + data.etudiant);
        node.setAttribute("aria-label", labelParts.join(" "));
      });
    }

    // Rendu panneau d’information
    function renderInfo(id) {
      var data = nodesData[id];
      var nodes = document.querySelectorAll(".node");
      nodes.forEach(function (n) { n.classList.remove("active"); });

      var activeNode = document.querySelector('.node[data-id="' + id + '"]');
      if (activeNode) { activeNode.classList.add("active"); }

      if (!data) {
        infoTitleEl.textContent = "Sommet non renseigné";
        infoMetaEl.innerHTML =
          '<span><strong>Type :</strong> —</span>' +
          '<span><strong>Figure :</strong> —</span>' +
          '<span><strong>Étudiant·e :</strong> —</span>';
        infoDescEl.textContent =
          "Ce sommet n’est pas encore associé à un projet ou une ressource.";
        infoTagsEl.innerHTML = "";
        infoLinkEl.style.display = "none";
        btnPreviewEl.disabled = true;
        return;
      }

      var isMeta =
        (data.type || "").toLowerCase().indexOf("méta") !== -1 ||
        (data.type || "").toLowerCase().indexOf("meta") !== -1;

      infoTitleEl.textContent = data.titre || "(Sans titre)";

      var metaLines = [];
      metaLines.push(
        "<span><strong>Type :</strong> " +
        (data.type || (isMeta ? "Méta" : "Projet étudiant")) +
        "</span>"
      );
      metaLines.push(
        "<span><strong>Figure :</strong> " + (data.figure || "—") + "</span>"
      );
      metaLines.push(
        "<span><strong>Étudiant·e :</strong> " + (data.etudiant || "—") + "</span>"
      );

      infoMetaEl.innerHTML = metaLines.join("");

      if (data.resume) {
        infoDescEl.textContent = data.resume;
      } else {
        infoDescEl.textContent = isMeta
          ? "Fiche méta renvoyant à une ressource (site du BUT, description de cours, etc.)."
          : "Sommet associé à un site étudiant présentant une figure clé des sciences de l’information.";
      }

      infoTagsEl.innerHTML = "";
      if (Array.isArray(data.tags) && data.tags.length) {
        data.tags.forEach(function (tag) {
          var span = document.createElement("span");
          span.className = "info-tag-pill";
          span.textContent = tag;
          infoTagsEl.appendChild(span);
        });
      }

      if (data.url && data.url !== "#" && data.url.trim() !== "") {
        infoLinkEl.style.display = "inline-flex";
        infoLinkEl.href = data.url;
      } else {
        infoLinkEl.style.display = "none";
      }

      btnPreviewEl.disabled = true;
    }

    // Vue liste
    function buildListView() {
      listViewEl.innerHTML = "";
      for (var id in nodesData) {
        if (!nodesData.hasOwnProperty(id)) continue;
        var data = nodesData[id];

        var card = document.createElement("article");
        card.className = "list-card";

        var typeLower = (data.type || "").toLowerCase();
        var isMeta = typeLower.indexOf("méta") !== -1 || typeLower.indexOf("meta") !== -1;

        var tagsHtml =
          '<span class="tag ' + (isMeta ? "meta" : "projet") + '">' +
          (data.type || "") + "</span>";

        var metaTextParts = [];
        if (data.figure)   metaTextParts.push(data.figure);
        if (data.etudiant) metaTextParts.push(data.etudiant);
        var metaText = metaTextParts.join(" – ");

        card.innerHTML =
          '<div class="list-card-title">' + (data.titre || "(Sans titre)") + "</div>" +
          '<div class="list-card-meta">' + metaText + "</div>" +
          (data.resume
            ? '<div class="list-card-summary">' + data.resume + "</div>"
            : "") +
          '<div class="list-card-tags">' + tagsHtml + "</div>";

        (function (idCopy) {
          card.addEventListener("click", function () {
            renderInfo(idCopy);
          });
        })(id);

        listViewEl.appendChild(card);
      }
    }

    // interactions sur les nœuds
    var nodeEls = document.querySelectorAll(".node");
    nodeEls.forEach(function (node) {
      var id = node.getAttribute("data-id");

      node.addEventListener("mouseenter", function () {
        renderInfo(id);
      });

      node.addEventListener("focus", function () {
        renderInfo(id);
      });

      node.addEventListener("click", function () {
        var data = nodesData[id];
        if (data && data.url && data.url !== "#" && data.url.trim() !== "") {
          window.open(data.url, "_blank");
        }
      });
    });

    // mode liste / tesseract
    btnListEl.addEventListener("click", function () {
      if (appEl.classList.contains("layout-list")) {
        appEl.classList.remove("layout-list");
        btnListEl.textContent = "Mode liste";
      } else {
        appEl.classList.add("layout-list");
        btnListEl.textContent = "Mode tesseract";
      }
    });

    // inclinaison légère au survol (pas de rotation automatique)
    if (tesseractZoneEl && tesseractEl) {
      tesseractZoneEl.addEventListener("mousemove", function (event) {
        var rect = tesseractZoneEl.getBoundingClientRect();
        var x = (event.clientX - rect.left) / rect.width - 0.5;
        var y = (event.clientY - rect.top) / rect.height - 0.5;

        var rotateX = 18 - y * 18;
        var rotateY = -22 + x * 26;

        tesseractEl.style.transform =
          "rotateX(" + rotateX + "deg) rotateY(" + rotateY + "deg)";
      });

      tesseractZoneEl.addEventListener("mouseleave", function () {
        tesseractEl.style.transform = "rotateX(18deg) rotateY(-22deg)";
      });
    }

    // chargement depuis le CSV
    function loadFromCSV() {
      if (!CSV_URL) {
        syncNodesWithData();
        buildListView();
        return;
      }

      fetch(CSV_URL)
        .then(function (res) { return res.text(); })
        .then(function (text) {
          var rows = parseCSV(text);
          if (!rows.length) {
            syncNodesWithData();
            buildListView();
            return;
          }

          var newData = {};

          rows.forEach(function (row) {
            // correspondance exacte avec le tableur :
            // id,type,titre,resume,tags,url,etudiant,figure
            var id = (row.id || row.ID || "").trim();
            if (!id) return;

            var typeRaw   = (row.type      || row.Type      || "").trim();
            var titre     = (row.titre     || row.Titre     || row.title  || row.Title  || "").trim();
            var resume    = (row.resume    || row.Resume    || "").trim();
            var tagsStr   = (row.tags      || row.Tags      || "").trim();
            var url       = (row.url       || row.URL       || "").trim();
            var etudiant  = (row.etudiant  || row.Etudiant  || row["étudiant"] || "").trim();
            var figure    = (row.figure    || row.Figure    || "").trim();

            var tagsArr = tagsStr
              .split(/[,|]/)
              .map(function (t) { return t.trim(); })
              .filter(function (t) { return t.length > 0; });

            newData[id] = {
              id: id,
              type: typeRaw || "Projet étudiant",
              titre: titre,
              resume: resume,
              tags: tagsArr,
              url: url,
              etudiant: etudiant,
              figure: figure
            };
          });

          if (Object.keys(newData).length) {
            nodesData = newData;
          }

          syncNodesWithData();
          buildListView();
        })
        .catch(function () {
          // en cas d’erreur, on reste sur les données par défaut
          syncNodesWithData();
          buildListView();
        });
    }

    // initialisation
    syncNodesWithData();
    buildListView();
    loadFromCSV();
  });
</script>
